<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Production Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 8px; margin-bottom: 20px; }
        h2 { margin: 0; color: #ffffff; }
        select#langSelect { background: #2c2c2c; color: #fff; padding: 5px 10px; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        h3 { color: #ffffff; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .section { margin-bottom: 25px; padding: 15px; background: #252525; border-radius: 6px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #b0b0b0; }
        input[type="text"], textarea { width: 100%; padding: 10px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 75px; resize: vertical; }
        button { background: #007acc; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; width: 100%; margin-top: 5px; }
        button:hover { background: #005999; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; background: #2c2c2c; }
        th, td { padding: 8px; border: 1px solid #444; text-align: left; font-size: 13px; }
        th { background: #333; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2 id="txtTitle">Film Production Hub</h2>
        <select id="langSelect" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="rw">Kinyarwanda</option>
        </select>
    </div>

    <!-- SECTION 1: Character & Ultra-Realistic Prompt Builder -->
    <div class="section">
        <h3 id="txtSec1">1. Ultra-Realistic Character Prompt Builder</h3>
        <div class="form-group">
            <label id="lblCharName">Character Name:</label>
            <input type="text" id="charName" placeholder="e.g., Lead Actor">
        </div>
        <div class="form-group">
            <label id="lblCharTraits">Appearance & Real-Life Style Details:</label>
            <textarea id="charTraits" placeholder="e.g., Gritty tactical jacket, realistic skin textures, natural outdoor lighting"></textarea>
        </div>
        <button id="btnGenPrompt" onclick="generatePrompt()">Generate Real-Life Cinematic Prompt</button>
        
        <div class="form-group" style="margin-top: 12px;">
            <label id="lblOutputPrompt">Auto-Generated Professional Prompt:</label>
            <textarea id="outputPrompt" readonly placeholder="Your ultra-realistic prompt will appear here..."></textarea>
        </div>
    </div>

    <!-- SECTION 2: Scene Creator -->
    <div class="section">
        <h3 id="txtSec2">2. Scene Creator</h3>
        <div class="form-group">
            <label id="lblSceneTitle">Scene Title / Location:</label>
            <input type="text" id="sceneTitle" placeholder="e.g., Scene 1: Street Encounter">
        </div>
        <div class="form-group">
            <label id="lblSceneAction">Scene Action Details:</label>
            <textarea id="sceneAction" placeholder="Describe what happens in this scene..."></textarea>
        </div>
        <button id="btnAddScene" onclick="addSceneToList()">Add Scene</button>

        <h3 id="txtSceneList" style="margin-top: 20px;">Scene List</h3>
        <table id="sceneTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th id="thTitle">Title</th>
                    <th id="thAction">Action</th>
                    <th id="thStatus">Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamic rows go here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const translations = {
        en: {
            title: "Film Production Hub",
            sec1: "1. Ultra-Realistic Character Prompt Builder",
            lblCharName: "Character Name:",
            phCharName: "e.g., Lead Actor",
            lblCharTraits: "Appearance & Real-Life Style Details:",
            phCharTraits: "e.g., Gritty tactical jacket, realistic skin textures, natural outdoor lighting",
            btnGenPrompt: "Generate Real-Life Cinematic Prompt",
            lblOutputPrompt: "Auto-Generated Professional Prompt:",
            sec2: "2. Scene Creator",
            lblSceneTitle: "Scene Title / Location:",
            phSceneTitle: "e.g., Scene 1: Street Encounter",
            lblSceneAction: "Scene Action Details:",
            phSceneAction: "Describe what happens in this scene...",
            btnAddScene: "Add Scene",
            sceneList: "Scene List",
            thTitle: "Title",
            thAction: "Action",
            thStatus: "Status",
            statusActive: "Active",
            alertChar: "Please fill in character name and appearance details.",
            alertScene: "Please fill in scene title and action details."
        },
        rw: {
            title: "Urubuga rw'imyidagaduro na Filime",
            sec1: "1. Gutegura Imiterere y'Ukinnyi (Prompt Nyayo)",
            lblCharName: "Amazina y'Ukinnyi:",
            phCharName: "urugero: Umukinnyi mukuru",
            lblCharTraits: "Uko agaragara n'imiterere nyayo:",
            phCharTraits: "urugero: Imyenda y'akazi, uruhu rusanzwe, urumuri rwo hanze",
            btnGenPrompt: "Kora Prompt y'Ubugingo nyabwo",
            lblOutputPrompt: "Prompt yateguwe y'umwuga:",
            sec2: "2. Gutegura Icyiciro (Scene)",
            lblSceneTitle: "Umutwe w'Icyiciro / Aho Biberaho:",
            phSceneTitle: "urugero: Agace ka 1: Guhurira mu muhanda",
            lblSceneAction: "Ibyabaye muri iki cyiciro:",
            phSceneAction: "Sobanura ibiri bukorewe muri aka gace...",
            btnAddScene: "Ongeraho Icyiciro",
            sceneList: "Urutonde rwa Scene",
            thTitle: "Umutwe",
            thAction: "Ibikorwa",
            thStatus: "Uko bihagaze",
            statusActive: "Bikora",
            alertChar: "Nyamuneka yuzuza amazina y'ukinnyi n'imiterere ye.",
            alertScene: "Nyamuneka yuzuza umutwe w'icyiciro n'ibikorwa."
        }
    };

    let sceneCount = 0;

    function changeLanguage() {
        let lang = document.getElementById('langSelect').value;
        let t = translations[lang];

        document.getElementById('txtTitle').innerText = t.title;
        document.getElementById('txtSec1').innerText = t.sec1;
        document.getElementById('lblCharName').innerText = t.lblCharName;
        document.getElementById('charName').placeholder = t.phCharName;
        document.getElementById('lblCharTraits').innerText = t.lblCharTraits;
        document.getElementById('charTraits').placeholder = t.phCharTraits;
        document.getElementById('btnGenPrompt').innerText = t.btnGenPrompt;
        document.getElementById('lblOutputPrompt').innerText = t.lblOutputPrompt;
        document.getElementById('txtSec2').innerText = t.sec2;
        document.getElementById('lblSceneTitle').innerText = t.lblSceneTitle;
        document.getElementById('sceneTitle').placeholder = t.phSceneTitle;
        document.getElementById('lblSceneAction').innerText = t.lblSceneAction;
        document.getElementById('sceneAction').placeholder = t.phSceneAction;
        document.getElementById('btnAddScene').innerText = t.btnAddScene;
        document.getElementById('txtSceneList').innerText = t.sceneList;
        document.getElementById('thTitle').innerText = t.thTitle;
        document.getElementById('thAction').innerText = t.thAction;
        document.getElementById('thStatus').innerText = t.thStatus;
    }

    function generatePrompt() {
        let lang = document.getElementById('langSelect').value;
        let t = translations[lang];
        let name = document.getElementById('charName').value;
        let traits = document.getElementById('charTraits').value;
        
        if(!name || !traits) { alert(t.alertChar); return; }

        // Upgraded prompt logic designed to force ultra-realistic, non-cartoon, live-action camera formatting
        let realisticPrompt = `Ultra-realistic live-action cinematic film shot, authentic real-life footages, shot on 35mm lens, natural daylighting, realistic skin pores and micro-details, subtle film grain, professional movie color grading, zero cartoon smoothing, zero CGI look. Character: ${name}. Details: ${traits}.`;
        
        document.getElementById('outputPrompt').value = realisticPrompt;
    }

    function addSceneToList() {
        let lang = document.getElementById('langSelect'].value;
        let t = translations[lang];
        let title = document.getElementById('sceneTitle').value;
        let action = document.getElementById('sceneAction').value;
        
        if(!title || !action) { alert(t.alertScene); return; }

        sceneCount++;
        let tableRef = document.getElementById('sceneTable').getElementsByTagName('tbody')[0];
        let newRow = tableRef.insertRow();
        newRow.insertCell(0).innerHTML = sceneCount;
        newRow.insertCell(1).innerHTML = title;
        newRow.insertCell(2).innerHTML = action;
        newRow.insertCell(3).innerHTML = `<span style='color: #4CAF50;'>${t.statusActive}</span>`;

        document.getElementById('sceneTitle').value = '';
        document.getElementById('sceneAction').value = '';
    }
</script>

</body>
</html>
