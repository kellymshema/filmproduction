<!DOCTYPE html>
<html lang="en" class="h-full bg-neutral-950 text-neutral-100 font-sans select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Production Hub - Premiere Studio Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nle: {
                            bg: '#121214',
                            panel: '#1e1e24',
                            header: '#26262e',
                            border: '#31313d',
                            accent: '#007acc',
                            accentHover: '#0098ff',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121214; }
        ::-webkit-scrollbar-thumb { background: #31313d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b4b5c; }

        input[type=range] { accent-color: #007acc; }

        .checkerboard-bg {
            background-color: #1a1a20;
            background-image: 
                linear-gradient(45deg, #111115 25%, transparent 25%), 
                linear-gradient(-45deg, #111115 25%, transparent 25%), 
        <!-- LEFT PANEL: MEDIA BIN & FX CONTROLS -->
        <aside class="w-full md:w-80 lg:w-96 bg-nle-panel rounded border border-nle-border flex flex-col overflow-hidden shrink-0">
            <!-- Tabs Header -->
            <div class="h-9 bg-neutral-900 border-b border-nle-border flex items-center px-2 space-x-1 text-xs">
                <button id="tab-actors-btn" onclick="switchLeftTab('actors')" class="px-2 py-1 rounded-t bg-nle-panel border-t border-x border-nle-accent text-white font-medium">
                    <i class="fa-solid fa-folder-open mr-1 text-purple-400"></i><span id="txt-tab-actors">Media Bin</span>
                </button>
                <button id="tab-audio-btn" onclick="switchLeftTab('audio')" class="px-2.5 py-1 rounded-t text-neutral-400 hover:text-white font-medium">
                    <i class="fa-solid fa-microphone mr-1 text-emerald-400"></i><span id="txt-tab-audio">Audio & Mic</span>
                </button>
                <button id="tab-bg-btn" onclick="switchLeftTab('bg')" class="px-2.5 py-1 rounded-t text-neutral-400 hover:text-white font-medium">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1 text-blue-400"></i><span id="txt-tab-bg">VFX & Grading</span>
                </button>
                <button id="tab-prompt-btn" onclick="switchLeftTab('prompt')" class="px-2.5 py-1 rounded-t text-neutral-400 hover:text-white font-medium">
                    <i class="fa-solid fa-feather mr-1 text-amber-400"></i><span id="txt-tab-prompt">Prompt Engine</span>
                </button>
            </div>

            <!-- TAB 1: MEDIA BIN & MULTI-ACTOR/VIDEO IMPORT -->
            <div id="tab-actors" class="flex-1 flex flex-col overflow-y-auto p-3 space-y-4">
                
                <!-- Media Bin Upload Controls -->
                <div class="bg-neutral-900 p-2.5 rounded border border-nle-border space-y-2">
                    <div class="text-[11px] font-semibold text-neutral-300 flex items-center justify-between">
                        <span><i class="fa-solid fa-file-video text-purple-400 mr-1.5"></i>Import Media to Tracks</span>
                        <span class="text-[9px] text-purple-300 font-mono">TOUCH & DRAG READY</span>
                    </div>

                    <div class="grid grid-cols-2 gap-1.5">
                        <label class="cursor-pointer bg-neutral-800 hover:bg-neutral-700 text-white p-2 rounded border border-nle-border text-[11px] flex items-center justify-center space-x-1.5 transition">
                            <i class="fa-solid fa-user-plus text-purple-400"></i>
                            <span>Import Actor (V2/V3)</span>
                            <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'actor')">
                        </label>
                        
                        <label class="cursor-pointer bg-neutral-800 hover:bg-neutral-700 text-white p-2 rounded border border-nle-border text-[11px] flex items-center justify-center space-x-1.5 transition">
                            <i class="fa-solid fa-film text-blue-400"></i>
                            <span>Import Video (V1)</span>
                            <input type="file" accept="video/mp4,video/webm" class="hidden" onchange="handleFileUpload(event, 'video')">
                        </label>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold text-neutral-300 flex items-center">
                            <i class="fa-solid fa-user-gear text-purple-400 mr-2"></i>Select Active Actor Layer
                        </label>
                        <span id="actor-layer-badge" class="text-[10px] text-purple-400 font-mono bg-purple-950/60 px-1.5 py-0.5 rounded border border-purple-800/40">TRACK V3</span>
                    </div>

                    <!-- Actor Selection Selector -->
                    <div class="flex items-center space-x-2">
                        <select id="actor-select" onchange="selectActorLayer(this.value)" class="flex-1 bg-neutral-900 border border-nle-border text-xs rounded p-1.5 text-neutral-200 focus:outline-none focus:border-nle-accent font-medium">
                            <option value="0">Actor 1 (Hero Operative - V2)</option>
                            <option value="1">Actor 2 (Co-Star / Villain - V3)</option>
                        </select>
                    </div>
                </div>

                <!-- Active Actor Transform Controls -->
                <div class="bg-neutral-900 p-2.5 rounded border border-nle-border space-y-2.5">
                    <div class="text-[11px] font-semibold text-neutral-300 flex justify-between items-center">
                        <span id="txt-active-actor-lbl">Actor 1 Transform & Placement</span>
                        <button onclick="resetActorTransform()" class="text-[10px] text-neutral-400 hover:text-white underline">Reset</button>
                    </div>

                    <!-- Scale Slider -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs text-neutral-400">
                            <span>Scale Size</span>
                            <span id="val-actor-scale" class="font-mono text-neutral-200">100%</span>
                        </div>
                        <input type="range" id="slider-actor-scale" min="20" max="200" value="100" oninput="updateTransforms()" class="w-full h-1 bg-neutral-800 rounded appearance-none cursor-pointer">
                    </div>

                    <!-- Position X & Y Sliders -->
                    <div class="grid grid-cols-2 gap-2">
                        <div class="space-y-1">
                            <div class="flex justify-between text-[11px] text-neutral-400">
                                <span>Pos X</span>
                                <span id="val-actor-x" class="font-mono text-neutral-200">0</span>
                            </div>
                            <input type="range" id="slider-actor-x" min="-400" max="400" value="0" oninput="updateTransforms()" class="w-full h-1 bg-neutral-800 rounded appearance-none cursor-pointer">
                        </div>

                        <div class="space-y-1">
                            <div class="flex justify-between text-[11px] text-neutral-400">
                                <span>Pos Y</span>
                                <span id="val-actor-y" class="font-mono text-neutral-200">0</span>
                            </div>
                            <input type="range" id="slider-actor-y" min="-250" max="250" value="0" oninput="updateTransforms()" class="w-full h-1 bg-neutral-800 rounded appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>

                <!-- Active Actor Chroma Key & Virtual Lighting FX -->
                <div class="bg-neutral-900 p-2.5 rounded border border-nle-border space-y-2.5">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold text-neutral-300">Chroma Key / Matte Isolation</span>
                        <input type="checkbox" id="fx-keying-toggle" checked onchange="updateFX()" class="w-4 h-4 accent-nle-accent rounded cursor-pointer">
                    </div>

                    <div class="flex items-center space-x-2 text-xs">
                        <span class="text-neutral-400 text-[11px]">Key Color:</span>
                        <button onclick="setKeyColor('#00ff00')" class="w-5 h-5 rounded bg-green-500 border border-white/20 focus:ring-2 ring-white" title="Green Screen"></button>
                        <button onclick="setKeyColor('#0000ff')" class="w-5 h-5 rounded bg-blue-600 border border-white/20 focus:ring-2 ring-white" title="Blue Screen"></button>
                        <button onclick="setKeyColor('#000000')" class="w-5 h-5 rounded bg-black border border-white/20 focus:ring-2 ring-white" title="Dark Matte"></button>
                    </div>

                    <!-- Lighting Balance for active actor -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-[11px] text-neutral-400">
                            <span>Virtual Light Balance</span>
                            <span id="val-light" class="font-mono text-neutral-200">100%</span>
                        </div>
                        <input type="range" id="slider-light" min="30" max="180" value="100" oninput="updateFX()" class="w-full h-1 bg-neutral-800 rounded appearance-none cursor-pointer">
                    </div>
                </div>

            </div>

            <!-- TAB 2: AUDIO MIXER & LIVE MIC RECORDER -->
            <div id="tab-audio" class="hidden flex-1 flex flex-col overflow-y-auto p-3 space-y-4">
                <div class="text-xs font-semibold text-neutral-300 flex items-center justify-between border-b border-nle-border pb-2">
                    <span><i class="fa-solid fa-microphone text-emerald-400 mr-2"></i>Live Voiceover & Audio Console</span>
                    <span class="text-[10px] text-emerald-400 font-mono">REC ORDER</span>
                </div>

                <!-- Live Voiceover Studio Recorder -->
                <div class="bg-neutral-900 p-3 rounded border border-nle-border space-y-2 text-center">
                    <div class="text-[11px] text-neutral-300 font-medium">Record Voiceover (A1 Track)</div>
                    <div class="flex items-center justify-center space-x-2">
                        <button id="btn-record-mic" onclick="toggleMicRecording()" class="px-3 py-1.5 rounded-full bg-red-600 hover:bg-red-500 text-white text-xs font-semibold flex items-center space-x-1.5 transition shadow">
                            <i id="mic-icon" class="fa-solid fa-microphone"></i>
                            <span id="mic-status-txt">Start Recording</span>
                        </button>
                    </div>
                    <div id="mic-timer" class="hidden text-xs font-mono text-red-400 animate-pulse">REC: 00:00</div>
                </div>

                <!-- Audio File Import -->
                <div class="space-y-1">
                    <label class="text-xs text-neutral-400">Upload Custom Audio File (MP3/WAV)</label>
                    <input type="file" accept="audio/*" onchange="handleFileUpload(event, 'audio')" class="w-full bg-neutral-900 border border-nle-border rounded p-1 text-xs text-neutral-300">
                </div>

                <!-- A1 Track Console -->
                <div class="bg-neutral-900 p-2.5 rounded border border-nle-border space-y-2">
                    <div class="flex items-center justify-between text-xs">
                        <span class="font-medium text-emerald-300">A1: Dialogue & Voiceover</span>
                        <div class="flex space-x-1">
                            <button id="mute-a1" onclick="toggleMute('a1')" class="px-1.5 py-0.5 text-[10px] rounded bg-neutral-800 text-neutral-400 font-mono">M</button>
                            <button id="solo-a1" onclick="toggleSolo('a1')" class="px-1.5 py-0.5 text-[10px] rounded bg-neutral-800 text-neutral-400 font-mono">S</button>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[11px] text-neutral-400">
                            <span>Track Volume</span>
                            <span id="val-vol-a1" class="font-mono text-neutral-200">80%</span>
                        </div>
                        <input type="range" id="vol-a1" min="0" max="100" value="80" oninput="updateAudioSettings()" class="w-full h-1 bg-neutral-800 rounded appearance-none cursor-pointer">
                    </div>
                </div>

                <!-- A2 Track Console -->
                <div class="bg-neutral-900 p-2.5 rounded border border-nle-border space-y-2">
                    <div class="flex items-center justify-between text-xs">
                        <span class="font-medium text-amber-300">A2: Background Music</span>
                        <div class="flex space-x-1">
                            <button id="mute-a2" onclick="toggleMute('a2')" class="px-1.5 py-0.5 text-[10px] rounded bg-neutral-800 text-neutral-400 font-mono">M</button>
                            <button id="solo-a2" onclick="toggleSolo('a2')" class="px-1.5 py-0.5 text-[10px] rounded bg-neutral-800 text-neutral-400 font-mono">S</button>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[11px] text-neutral-400">
                            <span>Track Volume</span>
                            <span id="val-vol-a2" class="font-mono text-neutral-200">60%</span>
                        </div>
                        <input type="range" id="vol-a2" min="0" max="100" value="60" oninput="updateAudioSettings()" class="w-full h-1 bg-neutral-800 rounded appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- TAB 3: VFX OVERLAYS & COLOR GRADING -->
            <div id="tab-bg" class="hidden flex-1 flex flex-col overflow-y-auto p-3 space-y-4">
                
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold text-neutral-300 flex items-center">
                            <i class="fa-solid fa-photo-film text-blue-400 mr-2"></i>Virtual Background Preset (V1)
                        </label>
                        <span class="text-[10px] text-blue-400 font-mono bg-blue-950/60 px-1.5 py-0.5 rounded border border-blue-800/40">V1 TRACK</span>
                    </div>

                    <div class="flex items-center space-x-2">
                        <select id="bg-preset-select" onchange="loadBgPreset(this.value)" class="flex-1 bg-neutral-900 border border-nle-border text-xs rounded p-1.5 text-neutral-200 focus:outline-none focus:border-nle-accent">
                            <option value="bg1">Cyberpunk City Rain</option>
                            <option value="bg2">Sci-Fi Control Room</option>
                            <option value="bg3">Dramatic Sunset Peak</option>
                            <option value="bg4">Film Studio LED Wall</option>
                        </select>
                    </div>
                </div>

                <!-- Expanded VFX Overlays (Film Grain, Lens Flare, Vignette, Glitch) -->
                <div class="bg-neutral-900 p-2.5 rounded border border-nle-border space-y-3">
                    <div class="text-[11px] font-semibold text-neutral-300">VFX Overlays & Lens Effects</div>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center space-x-2 text-neutral-300 cursor-pointer">
                            <input type="checkbox" id="vfx-grain" onchange="updateFX()" class="accent-nle-accent rounded">
                            <span>Film Grain</span>
                        </label>
                        <label class="flex items-center space-x-2 text-neutral-300 cursor-pointer">
                            <input type="checkbox" id="vfx-vignette" checked onchange="updateFX()" class="accent-nle-accent rounded">
                            <span>Cinematic Vignette</span>
                        </label>
                        <label class="flex items-center space-x-2 text-neutral-300 cursor-pointer">
                            <input type="checkbox" id="vfx-flare" onchange="updateFX()" class="accent-nle-accent rounded">
                            <span>Anamorphic Flare</span>
                        </label>
                        <label class="flex items-center space-x-2 text-neutral-300 cursor-pointer">
                            <input type="checkbox" id="vfx-glitch" onchange="updateFX()" class="accent-nle-accent rounded">
                            <span>Cyber Glitch</span>
                        </label>
                    </div>

                    <!-- Depth Blur Slider -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs text-neutral-400">
                            <span>Depth Blur</span>
                            <span id="val-blur" class="font-mono text-neutral-200">3px</span>
                        </div>
                        <input type="range" id="slider-blur" min="0" max="15" value="3" oninput="updateFX()" class="w-full h-1 bg-neutral-800 rounded appearance-none cursor-pointer">
                    </div>

                    <!-- Color Style Presets -->
                    <div class="space-y-1">
                        <label class="text-[11px] text-neutral-400">Cinematic Color Grade</label>
                        <select id="fx-preset-style" onchange="updateFX()" class="w-full bg-neutral-950 border border-nle-border text-xs rounded p-1.5 text-neutral-200">
                            <option value="none">Standard Rec.709</option>
                            <option value="cinematic" selected>Cinematic Teal & Orange</option>
                            <option value="scifi">Sci-Fi Neon Grid</option>
                            <option value="vintage">Vintage Warm Film Grain</option>
                            <option value="noir">High Contrast Film Noir</option>
                        </select>
                    </div>
                </div>

            </div>

            <!-- TAB 4: PROMPT & SCENE ENGINE -->
            <div id="tab-prompt" class="hidden flex-1 flex flex-col overflow-y-auto p-3 space-y-3">
                
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-neutral-300 flex items-center justify-between">
                        <span><i class="fa-solid fa-feather text-emerald-400 mr-2"></i><span id="lbl-scene-desc">Scene Action Prompt</span></span>
                        <span class="text-[10px] text-emerald-400 bg-emerald-950/60 px-1.5 py-0.5 rounded border border-emerald-800/40">Bilingual Engine</span>
                    </label>
                    <textarea id="scene-prompt-input" rows="3" class="w-full bg-neutral-900 border border-nle-border text-xs rounded p-2 text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-nle-accent font-sans" placeholder="Describe the scene e.g., Two operatives negotiating on rain-slick rooftop, cinematic lighting, 8k render..."></textarea>
                </div>

                <!-- Camera Motion & Atmosphere -->
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="text-neutral-400 block mb-1">Camera Motion</label>
                        <select id="camera-motion" onchange="setCameraMotion(this.value)" class="w-full bg-neutral-900 border border-nle-border rounded p-1.5 text-neutral-200">
                            <option value="static">Static Lock-off</option>
                            <option value="pan" selected>Slow Pan Right</option>
                            <option value="zoom">Dramatic Zoom In</option>
                            <option value="tracking">Smooth Tracking Shot</option>
                            <option value="crane">Crane Overhead</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-neutral-400 block mb-1">Atmosphere Lighting</label>
                        <select id="scene-lighting" class="w-full bg-neutral-900 border border-nle-border rounded p-1.5 text-neutral-200">
                            <option value="dramatic">Volumetric Cyberpunk</option>
                            <option value="golden">Golden Hour Sunset</option>
                            <option value="neon">Neon Night Club</option>
                            <option value="studio">Studio Softbox 3-Point</option>
                        </select>
                    </div>
                </div>

                <!-- Action Button -->
                <button onclick="synthesizeScene()" id="btn-synthesize" class="w-full bg-gradient-to-r from-emerald-600 to-blue-600 hover:from-emerald-500 hover:to-blue-500 text-white font-semibold py-2 px-3 rounded text-xs flex items-center justify-center space-x-2 transition shadow">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span id="txt-generate-btn">Synthesize Scene to Timeline</span>
                </button>

            </div>
        </aside>

            <!-- MULTI-TRACK NLE TIMELINE WITH TOUCHPAD CLIP TRIMMING -->
            <section class="h-64 bg-nle-panel rounded border border-nle-border flex flex-col overflow-hidden shrink-0">
                
                <!-- Timeline Bar -->
                <div class="h-8 bg-neutral-900 border-b border-nle-border flex items-center justify-between px-3 text-xs">
                    <div class="flex items-center space-x-3">
                        <span class="font-semibold text-neutral-300"><i class="fa-solid fa-film text-blue-400 mr-1.5"></i>Timeline Assembly</span>
                        <div class="flex items-center space-x-1 bg-neutral-950 p-0.5 rounded border border-neutral-800">
                            <button class="w-6 h-5 rounded bg-nle-accent text-white flex items-center justify-center text-[10px]" title="Selection Tool"><i class="fa-solid fa-mouse-pointer"></i></button>
                            <button onclick="razorSplit()" class="w-6 h-5 rounded hover:bg-neutral-800 text-neutral-400 hover:text-white flex items-center justify-center text-[10px]" title="Razor Split at Playhead (C)"><i class="fa-solid fa-scissors"></i></button>
                            <button onclick="mergeClips()" class="px-2 h-5 rounded bg-purple-900/60 hover:bg-purple-800 text-purple-200 text-[10px] font-mono flex items-center space-x-1" title="Merge Sequence Clips">
                                <i class="fa-solid fa-object-group"></i>
                                <span>Stitch Clips</span>
                            </button>
                        </div>

                        <!-- Timeline Zoom Controls for Touchpad -->
                        <div class="flex items-center space-x-1 bg-neutral-950 px-1.5 py-0.5 rounded border border-neutral-800 text-[10px] font-mono">
                            <span class="text-neutral-400">Zoom:</span>
                            <button onclick="zoomTimeline(0.8)" class="px-1 hover:text-white">-</button>
                            <span id="zoom-val" class="text-neutral-300">100%</span>
                            <button onclick="zoomTimeline(1.2)" class="px-1 hover:text-white">+</button>
                        </div>
                    </div>

                    <span class="text-[11px] font-mono text-neutral-400">DURATION: <span class="text-neutral-200">00:00:05:00</span></span>
                </div>

                <!-- Tracks Layout -->
                <div class="flex-1 flex overflow-hidden relative">
                    
                    <!-- Track Headers (V3, V2, V1, A1, A2) -->
                    <div class="w-32 bg-neutral-900 border-r border-nle-border flex flex-col shrink-0 text-[11px] font-mono select-none">
                        <div class="h-6 bg-neutral-950 border-b border-nle-border flex items-center px-2 text-neutral-500 text-[10px]">TRACKS</div>

                        <div class="h-8 border-b border-nle-border px-2 flex items-center justify-between bg-neutral-900">
                            <span class="px-1 bg-purple-900/60 text-purple-300 rounded font-bold text-[10px]">V3</span>
                            <span class="text-neutral-300 text-[9px]">Actor 2 FX</span>
                        </div>
                        <div class="h-8 border-b border-nle-border px-2 flex items-center justify-between bg-neutral-900">
                            <span class="px-1 bg-indigo-900/60 text-indigo-300 rounded font-bold text-[10px]">V2</span>
                            <span class="text-neutral-300 text-[9px]">Actor 1 FX</span>
                        </div>
                        <div class="h-8 border-b border-nle-border px-2 flex items-center justify-between bg-neutral-900">
                            <span class="px-1 bg-blue-900/60 text-blue-300 rounded font-bold text-[10px]">V1</span>
                            <span class="text-neutral-300 text-[9px]">Virtual BG / Vid</span>
                        </div>
                        <div class="h-8 border-b border-nle-border px-2 flex items-center justify-between bg-neutral-900">
                            <span class="px-1 bg-emerald-900/60 text-emerald-300 rounded font-bold text-[10px]">A1</span>
                            <span class="text-neutral-300 text-[9px]">Dialogue / Mic</span>
                        </div>
                        <div class="h-8 border-b border-nle-border px-2 flex items-center justify-between bg-neutral-900">
                            <span class="px-1 bg-amber-900/60 text-amber-300 rounded font-bold text-[10px]">A2</span>
                            <span class="text-neutral-300 text-[9px]">Music/SFX</span>
                        </div>
                    </div>

                    <!-- Timeline Workspace with Touch Trimming -->
                    <div id="timeline-area" class="flex-1 bg-neutral-950 relative overflow-hidden cursor-pointer" onclick="scrubTimelineFromClick(event)">
                        
                        <!-- Time Ruler -->
                        <div class="h-6 bg-neutral-900 border-b border-nle-border flex items-center font-mono text-[9px] text-neutral-500 relative select-none">
                            <div class="absolute left-2">00:00</div>
                            <div class="absolute left-1/4">00:01</div>
                            <div class="absolute left-2/4">00:02</div>
                            <div class="absolute left-3/4">00:03</div>
                            <div class="absolute right-2">00:05</div>
                        </div>

                        <!-- Tracks Container -->

        // Live Voiceover Microphone Recorder
        async function toggleMicRecording() {
            const btn = document.getElementById('btn-record-mic');
            const statusTxt = document.getElementById('mic-status-txt');
            const timer = document.getElementById('mic-timer');

            if (!isRecordingMic) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        userAudioElement.src = URL.createObjectURL(audioBlob);
                        document.getElementById('lbl-clip-a1').innerText = "Voiceover_Recorded.wav";
                    };

                    mediaRecorder.start();
                    isRecordingMic = true;
                    statusTxt.innerText = "Stop Recording";
                    btn.className = "px-3 py-1.5 rounded-full bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold flex items-center space-x-1.5 transition shadow";
                    timer.classList.remove('hidden');
                } catch (err) {
                    alert("Microphone access permission required to record audio.");
                }
            } else {
                mediaRecorder.stop();
                isRecordingMic = false;
                statusTxt.innerText = "Start Recording";
                btn.className = "px-3 py-1.5 rounded-full bg-red-600 hover:bg-red-500 text-white text-xs font-semibold flex items-center space-x-1.5 transition shadow";
                timer.classList.add('hidden');
            }
        }

        // Touchpad / Touch Clip Trimming Handlers
        function initClipTrim(e, clipId, edge) {
            e.stopPropagation();
            activeTrimClip = document.getElementById(`clip-${clipId}`);
            trimEdge = edge;
        }

        function handleClipTrimMove(e) {
            if (!activeTrimClip || !trimEdge) return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const containerRect = document.getElementById('timeline-area').getBoundingClientRect();
            const relativeX = clientX - containerRect.left;
            const percentage = Math.max(0, Math.min(100, (relativeX / containerRect.width) * 100));

            const currentLeft = parseFloat(activeTrimClip.style.left || 0);
            const currentWidth = parseFloat(activeTrimClip.style.width || 50);

            if (trimEdge === 'start') {
                const newLeft = percentage;
                const newWidth = (currentLeft + currentWidth) - newLeft;
                if (newWidth > 5) {
                    activeTrimClip.style.left = newLeft + '%';
                    activeTrimClip.style.width = newWidth + '%';
                }
            } else if (trimEdge === 'end') {
                const newWidth = percentage - currentLeft;
                if (newWidth > 5) {
                    activeTrimClip.style.width = newWidth + '%';
                }
            }
        }

        function endClipTrim() {
            activeTrimClip = null;
            trimEdge = null;
        }

        function renderLoop() {
            mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

            const progress = playheadPosition / 100;
            let camScale = 1;
            let camPanX = 0;
            let camPanY = 0;

            if (cameraMotion === 'pan') camPanX = (progress - 0.5) * 120;
            else if (cameraMotion === 'zoom') camScale = 1 + (progress * 0.15);
            else if (cameraMotion === 'tracking') camPanX = Math.sin(progress * Math.PI * 2) * 40;
            else if (cameraMotion === 'crane') camPanY = (progress - 0.5) * 80;

            mainCtx.save();
            mainCtx.translate(mainCanvas.width / 2, mainCanvas.height / 2);
            mainCtx.scale(camScale, camScale);
            mainCtx.translate(-mainCanvas.width / 2 + camPanX, -mainCanvas.height / 2 + camPanY);

            // 1. Draw Custom Uploaded Video or Preset Background (V1)
            if (userVideoElement.readyState >= 2) {
                mainCtx.drawImage(userVideoElement, 0, 0, mainCanvas.width, mainCanvas.height);
            } else if (bgImg.complete && bgImg.width > 0) {
                mainCtx.save();
                if (vfx.blur > 0) mainCtx.filter = `blur(${vfx.blur}px)`;
                mainCtx.drawImage(bgImg, 0, 0, mainCanvas.width, mainCanvas.height);
                mainCtx.restore();
            }

            // 2. Render Multiple Actor Layers (V2 and V3)
            actors.forEach((act) => {
                if (act.img.complete && act.img.width > 0) {
                    mainCtx.save();
                    const brightness = act.light / 100;
                    let filterStr = `brightness(${brightness})`;

                    if (vfx.style === 'cinematic') filterStr += ` contrast(1.15) sepia(0.15) hue-rotate(-10deg)`;
                    else if (vfx.style === 'scifi') filterStr += ` contrast(1.3) hue-rotate(180deg)`;
                    else if (vfx.style === 'vintage') filterStr += ` sepia(0.4) contrast(0.9)`;
                    else if (vfx.style === 'noir') filterStr += ` grayscale(1) contrast(1.4)`;

                    mainCtx.filter = filterStr;

                    const scaleFactor = act.scale / 100;
                    const baseWidth = 480 * scaleFactor;
                    const baseHeight = 640 * scaleFactor;
                    const posX = (mainCanvas.width / 2) - (baseWidth / 2) + act.posX;
                    const posY = (mainCanvas.height / 2) - (baseHeight / 2) + 40 + act.posY;

                    mainCtx.drawImage(act.img, posX, posY, baseWidth, baseHeight);
                    mainCtx.restore();
                }
            });

            // 3. Render VFX Overlays
            if (vfx.vignette) {
                const grad = mainCtx.createRadialGradient(mainCanvas.width/2, mainCanvas.height/2, 300, mainCanvas.width/2, mainCanvas.height/2, 700);
                grad.addColorStop(0, 'transparent');
                grad.addColorStop(1, 'rgba(0,0,0,0.6)');
                mainCtx.fillStyle = grad;
                mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            }

            mainCtx.restore();
            requestAnimationFrame(renderLoop);
        }

        // Playback Engine Controls
        function togglePlayback() {
            isPlaying = !isPlaying;
            const playIcon = document.getElementById('play-icon');
            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause text-xs";
                playbackInterval = setInterval(advancePlayhead, 1000 / 24);
            } else {
                playIcon.className = "fa-solid fa-play text-xs";
                clearInterval(playbackInterval);
            }
        }

        function advancePlayhead() {
            playheadPosition += 0.5;
            if (playheadPosition > 100) {
                if (isLooping) playheadPosition = 0;
                else {
                    playheadPosition = 100;
                    togglePlayback();
                }
            }
            updatePlayheadUI();
        }

        function stepFrame(dir) {
            playheadPosition = Math.max(0, Math.min(100, playheadPosition + (dir * 0.5)));
            updatePlayheadUI();
        }

        function toggleLoop() {
            isLooping = !isLooping;
            document.getElementById('btn-loop').classList.toggle('text-nle-accent', isLooping);
        }

        function updatePlayheadUI() {
            document.getElementById('playhead').style.left = playheadPosition + '%';
            document.getElementById('transport-scrubber').value = playheadPosition;

            const totalSecs = (playheadPosition / 100) * 5;
            const secs = Math.floor(totalSecs);
            const frames = Math.floor((totalSecs - secs) * 24);
            document.getElementById('timecode-display').innerText = `00:00:${String(secs).padStart(2, '0')}:${String(frames).padStart(2, '0')}`;
        }

        function scrubFromTransport(val) {
            playheadPosition = parseFloat(val);
            updatePlayheadUI();
        }

        function scrubTimelineFromClick(e) {
            const rect = document.getElementById('timeline-area').getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            playheadPosition = Math.max(0, Math.min(100, (clickX / rect.width) * 100));
            updatePlayheadUI();
        }

        function synthesizeScene() {
            playheadPosition = 0;
            updatePlayheadUI();
            if (!isPlaying) togglePlayback();
        }

        // Modal & Export System
        function openExportModal() {
            const modal = document.getElementById('export-modal');
            modal.classList.remove('hidden');

            const seqName = document.getElementById('export-seq-name').value;
            const prompt = document.getElementById('scene-prompt-input').value || "Cinematic multi-track sequence assembly";

            const sql = `INSERT INTO SceneSequences (ProjectID, SceneNumber, SceneTitle, ActionDescription)\nVALUES (1, 1, '${seqName}', '${prompt.replace(/'/g, "''")}');`;
            document.getElementById('sql-payload').value = sql;
        }

        function closeExportModal() {
            document.getElementById('export-modal').classList.add('hidden');
        }

        function copyPayload() {
            const payload = document.getElementById('sql-payload').value;
            navigator.clipboard.writeText(payload);
            alert("SQL Payload copied to clipboard!");
            closeExportModal();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                mainCanvas.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        // Language Switcher
        function setLanguage(lang) {
            const btnEn = document.getElementById('lang-en');
            const btnRw = document.getElementById('lang-rw');

            if (lang === 'en') {
                btnEn.className = "px-2 py-0.5 text-[11px] rounded bg-nle-accent text-white font-medium";
                btnRw.className = "px-2 py-0.5 text-[11px] rounded text-neutral-400 hover:text-white font-medium";
                document.getElementById('txt-tab-actors').innerText = "Layer FX Inspector";
                document.getElementById('txt-tab-audio').innerText = "Audio Mixer";
                document.getElementById('txt-tab-bg').innerText = "VFX & Grading";
                document.getElementById('txt-tab-prompt').innerText = "Prompt Engine";
                document.getElementById('lbl-scene-desc').innerText = "Scene Action Prompt";
                document.getElementById('txt-generate-btn').innerText = "Synthesize Scene to Timeline";
                document.getElementById('txt-program-monitor').innerText = "Program Monitor: Sequence 01";
                document.getElementById('txt-export-btn').innerText = "Export Scene";
            } else {
                btnRw.className = "px-2 py-0.5 text-[11px] rounded bg-nle-accent text-white font-medium";
                btnEn.className = "px-2 py-0.5 text-[11px] rounded text-neutral-400 hover:text-white font-medium";
                document.getElementById('txt-tab-actors').innerText = "Nyarura Ibice by'Inshusho";
                document.getElementById('txt-tab-audio').innerText = "Amajwi (Mixer)";
                document.getElementById('txt-tab-bg').innerText = "Ibice by'Inshusho";
                document.getElementById('txt-tab-prompt').innerText = "Ibyerekeye Scene";
                document.getElementById('lbl-scene-desc').innerText = "Ibisobanuro by'Ikiranga Scene";
                document.getElementById('txt-generate-btn').innerText = "Kora Scene Muri Timeline";
                document.getElementById('txt-program-monitor').innerText = "Screen y'Ikinyemera: Sequence 01";
                document.getElementById('txt-export-btn').innerText = "Sohora Scene";
            }
        }
    </script>
